[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-document-reconstructor"
version = "0.1.0"
authors = [
  { name="Lorenzo", email="lorenhey@github.com" },
]
description = "Reconstructing scientific documents from scans into structured, auditable digital editions."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0",
    "Pillow",
    "numpy",
    "opencv-python-headless",
    "pdf2image",
    "typer[all]",
    "rich",
    "jinja2",
    "pytesseract",
    "pdfplumber",
    "fastapi",
    "uvicorn"
]

[project.scripts]
sdr = "scientific_document_reconstructor.cli.main:app"

[tool.setuptools.packages.find]
include = ["scientific_document_reconstructor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
